basePath: /api/v1
definitions:
  dto.CreateItemInput:
    properties:
      description:
        example: This is item1
        type: string
      name:
        description: json:"name"はJSONのキー名を指定し、間違っている場合はエラーを返す
        minLength: 2
        type: string
      price:
        example: 100
        maximum: 999999
        minimum: 1
        type: integer
    required:
    - name
    - price
    type: object
  dto.LoginInput:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  dto.SignupInput:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  dto.UpdateItemInput:
    properties:
      description:
        type: string
      name:
        minLength: 2
        type: string
      price:
        maximum: 999999
        minimum: 1
        type: integer
      soldOut:
        type: boolean
    type: object
  models.Item:
    properties:
      created_at:
        type: string
      deleted_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      price:
        type: integer
      sold_out:
        type: boolean
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
info:
  contact: {}
  description: This is a sample server for a pet store.
  title: Swagger Example API
  version: "1.0"
paths:
  /api/v1/items/{id}:
    get:
      description: Get item from the database by ID
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      summary: Get item by ID
      tags:
      - items
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login with the input payload
      parameters:
      - description: User info
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.LoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: token
          schema:
            type: string
        "400":
          description: bad request
          schema:
            type: string
        "404":
          description: user not found
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Login
      tags:
      - auth
  /auth/signup:
    post:
      consumes:
      - application/json
      description: Create a new user with the input payload
      parameters:
      - description: User info
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.SignupInput'
      produces:
      - application/json
      responses:
        "201":
          description: created
          schema:
            type: string
        "400":
          description: bad request
          schema:
            type: string
        "500":
          description: internal server error
          schema:
            type: string
      summary: Create a new user
      tags:
      - auth
  /hello:
    get:
      consumes:
      - application/json
      description: do ping
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: liveness probe
      tags:
      - Hello World
  /items:
    get:
      description: Get all items from the database
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Item'
        "500":
          description: Internal Server Error
      summary: Get all items
      tags:
      - items
    post:
      consumes:
      - application/json
      description: Create a new item in the database
      parameters:
      - description: Item information
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/dto.CreateItemInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Item'
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Create a new item
      tags:
      - items
  /items/{id}:
    delete:
      description: Delete an item in the database
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            type: string
        "400":
          description: Bad Request
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      summary: Delete an item
      tags:
      - items
    put:
      consumes:
      - application/json
      description: Update an item in the database
      parameters:
      - default: 1
        description: Item ID
        in: path
        name: id
        required: true
        type: integer
      - description: Item information
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateItemInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      summary: Update an item
      tags:
      - items
swagger: "2.0"
