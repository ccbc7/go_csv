name: devcontainer

services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      # ワークスペース全体をマウント
      - ..:/workspace:cached
      # ツールのキャッシュ
      - go_csv_devcontainer_go_cache:/go/pkg/mod
      - go_csv_devcontainer_node_cache:/home/vscode/.npm
      # Dockerソケット（Docker in Docker用）
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "3000:3000"
      - "8080:8080"
      - "2345:2345"
    environment:
      # Go環境変数
      - GOMODCACHE=/go/pkg/mod
      - DATASTORE_PROJECT_ID=test-project
      - POSTGRES_DB=gin
      - POSTGRES_USER=ginuser
      - POSTGRES_PASSWORD=ginpassword
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      # Node.js環境変数
      - NODE_ENV=development
    command: sleep infinity
    depends_on:
      - db
    networks:
      - go_csv_devcontainer_network

  db:
    image: postgres:16-alpine
    container_name: go_csv_devcontainer_postgres
    ports:
      - "5432:5432"
    volumes:
      - go_csv_devcontainer_postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: gin
      POSTGRES_USER: ginuser
      POSTGRES_PASSWORD: ginpassword
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    networks:
      - go_csv_devcontainer_network

volumes:
  go_csv_devcontainer_postgres_data:
  go_csv_devcontainer_go_cache:
  go_csv_devcontainer_node_cache:

networks:
  go_csv_devcontainer_network:
    driver: bridge
